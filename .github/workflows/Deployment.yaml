name: Deployment

on:
  push:
    branches:
      - feat/auto-approve
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - stg
          - prd

# permissions:       
#   contents: read
#   deployments: write
#   id-token: write

env:
  DEFAULT_ENV: dev

jobs:
  build:
    name: Build Stage
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.env.outputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine Environment
        id: env
        run: |
          ENV="${{ github.event.inputs.environment || env.DEFAULT_ENV }}"
          echo "environment=$ENV" >> $GITHUB_OUTPUT

      - name: Run Build
        run: |
          echo "Building for environment: ${{ steps.env.outputs.environment }}"
          npm install
          npm run build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: |
            dist/
            build/

      - name: Generate GitHub App Token
        uses: tibdex/github-app-token@v2
        id: app_token
        with:
          app_id: ${{ secrets.WORKFLOW_AUTO_APPROVE_APP_ID }}
          private_key: ${{ secrets.WORKFLOW_AUTO_APPROVE_SECRET }}

      - name: Trigger Auto-Approval via Repository Dispatch
        if: ${{ steps.env.outputs.environment != 'dev' }}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.WORKFLOW_APPROVAL }}
          event-type: auto-approve
          repository: RanjitThakur678/auto-approve
          client-payload: |
            {
              "run_id": "${{ github.run_id }}",
              "actor": "${{ github.actor }}",
              "environment": "${{ steps.env.outputs.environment }}",
              "workflow_name": "${{ github.workflow }}",
              "branch": "${{ github.ref_name }}",
            }


  deploy:
    name: Deployment Stage
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ needs.build.outputs.target_env }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Deploy Application
        run: |
          echo "Deploying to environment: ${{ needs.build.outputs.target_env }}"
          # your deployment commands

      - name: Deployment Complete
        run: echo "Deployment completed."
