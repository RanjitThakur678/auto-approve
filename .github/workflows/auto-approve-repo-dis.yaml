name: Auto Approval

on:
  repository_dispatch:
    types: [auto-approve]

permissions:
  contents: read
  deployments: write
  actions: read
  id-token: write

jobs:
  auto-approve:
    runs-on: ubuntu-latest

    steps:
      - name: Check Actor
        id: check_actor
        run: |
          ACTOR="${{ github.event.client_payload.actor }}"
          if [[ "$ACTOR" != "approverauto" ]]; then
            echo "Actor $ACTOR is not allowed to approve deployments."
            exit 1
          fi
          echo "Actor is approved."

      - name: Approve Deployment
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_APPROVAL }}
          ENVIRONMENT: ${{ github.event.client_payload.environment }}
          WORKFLOW_NAME: ${{ github.event.client_payload.workflow_name }}
          BRANCH: ${{ github.event.client_payload.branch }}
        run: |
          echo "Auto-approving workflow $WORKFLOW_NAME on branch $BRANCH for environment $ENVIRONMENT"

          # Get the workflow runs for the given workflow & branch
          RUN_ID=$(gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/${GITHUB_REPOSITORY}/actions/runs \
            -q ".workflow_runs[] | select(.name==\"${WORKFLOW_NAME}\" and .head_branch==\"${BRANCH}\" and .status==\"in_progress\") | .id" \
          )

          if [[ -z "$RUN_ID" ]]; then
            echo "No in-progress workflow run found to approve."
            exit 1
          fi

          echo "Found workflow run ID: $RUN_ID"

          # Approve environment protection (simulate approval via GitHub API)
          gh api \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/pending_deployments \
            -f state=approved

          echo "Deployment auto-approved successfully!"
