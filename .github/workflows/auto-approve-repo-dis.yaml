name: Auto Approval by Repo dispatch

on:
  repository_dispatch:
    types: [auto-approve]

permissions:
  deployments: write
  contents: read

jobs:
  auto-approve:
    runs-on: ubuntu-latest

    steps:
      - name: Validate Actor
        run: |
          if [[ "${{ github.event.client_payload.actor }}" != "approverauto" ]]; then
            echo "Actor not allowed"
            exit 1
          fi

      - name: Install GH CLI
        run: sudo apt-get update && sudo apt-get install -y gh jq

      - name: Wait for run to reach approval state
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_APPROVAL }}
        run: |
          RUN_ID="${{ github.event.client_payload.run_id }}"
          echo "Checking run: $RUN_ID"

          for i in {1..30}; do
            STATUS=$(gh api \
              -H "Accept: application/vnd.github+json" \
              /repos/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID \
              -q '.status'
            )

            if [[ "$STATUS" == "waiting" ]]; then
              echo "Run is waiting for approval!"
              break
            fi

            echo "Run status: $STATUS (waiting...)"
            sleep 5
          done

      - name: Approve Deployment
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_APPROVAL }}
        run: |
          RUN_ID="${{ github.event.client_payload.run_id }}"

          echo "Fetching pending deployments for run $RUN_ID..."

          pending=$(gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/pending_deployments)

          # Extract numeric environment IDs safely (convert to pure integers)
          ENV_IDS=$(echo "$pending" | jq -r '.[]?.environment.id | tonumber')

          if [[ -z "$ENV_IDS" ]]; then
            echo "❌ No pending environment approvals found."
            echo "$pending"
            exit 1
          fi

          echo "Pending environment IDs:"
          echo "$ENV_IDS"

          echo "Approving deployment..."

          # Build GH CLI POST command safely
          CMD=(gh api --method POST
            -H "Accept: application/vnd.github+json"
            /repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/pending_deployments
            -f state=approved
            -f comment="Auto approved by workflow"
          )

          # Append each integer environment ID without quotes
          for id in $ENV_IDS; do
            CMD+=(-f "environment_ids[]=$id")
          done

          # Execute final command
          "${CMD[@]}"

          echo "🎉 Deployment approved successfully!"
