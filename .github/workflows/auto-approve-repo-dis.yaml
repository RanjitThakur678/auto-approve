name: Auto Approval by Repo dispatch

on:
  repository_dispatch:
    types: [auto-approve]

permissions:
  deployments: write
  contents: read

jobs:
  auto-approve:
    runs-on: ubuntu-latest

    steps:
      - name: Validate Actor
        run: |
          if [[ "${{ github.event.client_payload.actor }}" != "approverauto" ]]; then
            echo "Actor not allowed"
            exit 1
          fi

      - name: Install GH CLI
        run: sudo apt-get update && sudo apt-get install -y gh jq

      - name: Wait for run to reach approval state
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_APPROVAL }}
        run: |
          RUN_ID="${{ github.event.client_payload.run_id }}"
          echo "Checking run: $RUN_ID"

          for i in {1..30}; do
            STATUS=$(gh api \
              -H "Accept: application/vnd.github+json" \
              /repos/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID \
              -q '.status'
            )

            if [[ "$STATUS" == "waiting" ]]; then
              echo "Run is waiting for approval!"
              break
            fi

            echo "Run status: $STATUS (waiting...)"
            sleep 5
          done

      - name: Approve Deployment
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_APPROVAL }}
        run: |
          RUN_ID="${{ github.event.client_payload.run_id }}"
          echo "Approving run $RUN_ID..."

          gh api \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/pending_deployments \
            -f state=approved

          echo "Approved run $RUN_ID successfully!"
