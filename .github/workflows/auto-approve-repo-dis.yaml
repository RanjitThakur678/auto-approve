name: Auto Approval by Repo dispatch

on:
  repository_dispatch:
    types: [auto-approve]

permissions:
  contents: read
  deployments: write
  actions: read
  id-token: write

jobs:
  auto-approve:
    runs-on: ubuntu-latest

    steps:
      # -----------------------
      # 1. Validate actor
      # -----------------------
      - name: Check Actor
        run: |
          PAYLOAD_ACTOR="${{ github.event.client_payload.actor }}"
          if [[ "$PAYLOAD_ACTOR" != "approverauto" ]]; then
            echo "❌ Actor $PAYLOAD_ACTOR is not allowed to auto-approve."
            exit 1
          fi
          echo "✅ Actor validated: $PAYLOAD_ACTOR"

      # -----------------------
      # 2. Prepare variables
      # -----------------------
      - name: Prepare Variables
        id: prep
        run: |
          echo "RUN_ID=${{ github.event.client_payload.run_id }}" >> $GITHUB_ENV
          echo "ENVIRONMENT=${{ github.event.client_payload.environment }}" >> $GITHUB_ENV
          echo "BRANCH=${{ github.event.client_payload.branch }}" >> $GITHUB_ENV
          echo "WORKFLOW_NAME=${{ github.event.client_payload.workflow_name }}" >> $GITHUB_ENV

      # -----------------------
      # 3. Install & authenticate gh
      # -----------------------
      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh jq

      - name: Authenticate GH CLI
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_APPROVAL }}
        run: |
          echo "$GH_TOKEN" | gh auth login --with-token

      # -----------------------
      # 4. Wait for run to reach "waiting" state
      # -----------------------
      - name: Wait for run to be in waiting state
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_APPROVAL }}
        run: |
          echo "⏳ Waiting for run $RUN_ID to reach 'waiting' approval state..."
          for i in {1..30}; do
            STATUS=$(gh api \
              -H "Accept: application/vnd.github+json" \
              /repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID} \
              -q '.status' 2>/dev/null || echo "unknown")

            echo "Attempt $i → Status: $STATUS"

            if [[ "$STATUS" == "waiting" ]]; then
              echo "✅ Run is waiting for approval!"
              break
            fi

            sleep 5
          done

      # -----------------------
      # 5. Approve environment gate
      # -----------------------
      - name: Approve Deployment
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_APPROVAL }}
        run: |
          echo "🚀 Approving deployment for run $RUN_ID..."

          gh api \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/pending_deployments \
            -f state=approved

          echo "🎉 Deployment auto-approved successfully!"
